<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>経営哲学コンサルティング</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#06070a;
    --gold:#c6a15b;
    --gold-soft:#e8d5a8;
    --text-primary:#f3efe6;
    --text-secondary:#9ca6b8;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg-deep);
    font-family:'Zen Kaku Gothic New', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  body{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* ===== 背景:大自然の実写真 + ダークフォグ ===== */
  .bg-photo{
    position:fixed;
    inset:-4%;
    z-index:0;
    background-image:
      linear-gradient(rgba(4,5,8,0.15), rgba(4,5,8,0.15)),
      url('https://images.unsplash.com/photo-1756155017513-6fceb5ace3ba?fm=jpg&q=80&w=1920&auto=format&fit=crop');
    background-size:cover;
    background-position:center;
    filter:brightness(0.66) saturate(0.9) contrast(1.0);
    animation:kenburns 42s ease-in-out infinite alternate;
  }

  @keyframes kenburns{
    0%{ transform:scale(1) translate(0,0); }
    100%{ transform:scale(1.09) translate(-1%, -1%); }
  }

  .fog-dark{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    background:
      linear-gradient(180deg, rgba(4,5,8,0.5) 0%, rgba(4,5,8,0.14) 32%, rgba(4,5,8,0.24) 62%, rgba(4,5,8,0.68) 100%);
  }

  .fog-band{
    position:fixed;
    left:-25%;
    width:150%;
    height:30vh;
    background:linear-gradient(90deg, transparent, rgba(210,208,200,0.16) 25%, rgba(210,208,200,0.24) 50%, rgba(210,208,200,0.16) 75%, transparent);
    filter:blur(12px);
    z-index:1;
    pointer-events:none;
  }
  .fog-1{ top:8vh; height:22vh; opacity:.6; animation:driftRight 50s linear infinite; }
  .fog-2{ bottom:0; height:34vh; opacity:.75; animation:driftLeft 66s linear infinite; }

  @keyframes driftRight{
    0%{ transform:translateX(-6%); }
    50%{ transform:translateX(6%); }
    100%{ transform:translateX(-6%); }
  }
  @keyframes driftLeft{
    0%{ transform:translateX(6%); }
    50%{ transform:translateX(-6%); }
    100%{ transform:translateX(6%); }
  }

  .vignette{
    position:fixed;
    inset:0;
    z-index:2;
    pointer-events:none;
    background:radial-gradient(ellipse 85% 75% at 50% 46%, transparent 38%, rgba(2,3,5,0.55) 100%);
  }

  /* ===== メインコンテンツ ===== */
  .content{
    position:relative;
    z-index:3;
    width:100%;
    max-width:720px;
    padding:5vh 6vw;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  .logo-wrap{
    position:relative;
    margin-bottom:4.2vh;
    opacity:0;
    animation:fadeIn 1.6s ease-out .3s forwards;
  }

  .logo-glow{
    position:absolute;
    left:50%;
    top:50%;
    width:220px;
    height:220px;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(198,161,91,0.22) 0%, transparent 70%);
    animation:breathe 5.5s ease-in-out infinite;
    z-index:-1;
  }
  @keyframes breathe{
    0%,100%{ opacity:.5; transform:translate(-50%,-50%) scale(.9); }
    50%{ opacity:1; transform:translate(-50%,-50%) scale(1.15); }
  }

  .logo-text{
    display:block;
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:clamp(22px, 3.4vh, 34px);
    letter-spacing:.14em;
    color:var(--gold-soft);
    background:linear-gradient(180deg, var(--gold-soft) 0%, var(--gold) 55%, var(--gold-soft) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 18px rgba(198,161,91,0.35));
    white-space:nowrap;
  }

  @keyframes fadeIn{
    from{ opacity:0; transform:translateY(-8px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .catch{
    font-family:'Shippori Mincho', serif;
    color:var(--text-primary);
    letter-spacing:.06em;
  }

  .catch .line{
    display:block;
    opacity:0;
    transform:translateY(14px);
    animation:lineUp 1.1s ease-out forwards;
  }
  .catch .line:nth-child(1){ font-size:clamp(20px,3.4vh,30px); font-weight:600; line-height:1.7; animation-delay:1.0s; text-shadow:0 2px 18px rgba(0,0,0,.5); }
  .catch .line:nth-child(2){ font-size:clamp(15px,2.2vh,19px); color:var(--gold-soft); font-weight:500; line-height:1.7; margin-top:2.4vh; animation-delay:1.35s; text-shadow:0 2px 14px rgba(0,0,0,.5); }
  .catch .line.words{ font-size:clamp(12.5px,1.8vh,15px); color:var(--text-secondary); font-family:'Zen Kaku Gothic New', sans-serif; letter-spacing:.14em; margin-top:2.8vh; animation-delay:1.7s; }

  @keyframes lineUp{
    to{ opacity:1; transform:translateY(0); }
  }

  /* 4つの単語がルーティンで1つずつ強調されるモーション */
  .word{
    display:inline-block;
    transition:none;
    animation:wordCycle 8s ease-in-out infinite;
  }
  .word + .word{ margin-left:.55em; }
  .word.w1{ animation-delay:0s; }
  .word.w2{ animation-delay:-2s; }
  .word.w3{ animation-delay:-4s; }
  .word.w4{ animation-delay:-6s; }

  @keyframes wordCycle{
    0%, 3%   { color:var(--text-secondary); font-weight:400; text-shadow:none; transform:scale(1); }
    8%       { color:var(--gold); font-weight:700; text-shadow:0 0 16px rgba(198,161,91,.55); transform:scale(1.08); }
    20%      { color:var(--gold); font-weight:700; text-shadow:0 0 16px rgba(198,161,91,.55); transform:scale(1.08); }
    27%, 100%{ color:var(--text-secondary); font-weight:400; text-shadow:none; transform:scale(1); }
  }

  .sep{
    color:var(--text-secondary);
    opacity:.5;
  }
  .sep + .word{ margin-left:.55em; }

  .divider{
    width:1px;
    height:5vh;
    background:linear-gradient(to bottom, transparent, var(--gold), transparent);
    margin:4vh 0;
    opacity:0;
    animation:fadeIn 1.2s ease-out 2.0s forwards;
  }

  .actions{
    display:flex;
    gap:22px;
    opacity:0;
    animation:fadeIn 1.2s ease-out 2.2s forwards;
  }

  .btn{
    position:relative;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:168px;
    padding:14px 30px;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:13px;
    font-weight:500;
    letter-spacing:.22em;
    color:var(--text-primary);
    text-decoration:none;
    border:1px solid rgba(198,161,91,0.55);
    border-radius:2px;
    background:rgba(198,161,91,0.06);
    backdrop-filter:blur(2px);
    overflow:hidden;
    transition:color .5s ease, border-color .5s ease, box-shadow .5s ease, transform .3s ease;
  }

  .btn::before{
    content:'';
    position:absolute;
    inset:0;
    background:var(--gold);
    transform:scaleX(0);
    transform-origin:left;
    transition:transform .5s cubic-bezier(.4,0,.2,1);
    z-index:-1;
  }

  .btn:hover{
    color:#0a0e17;
    border-color:var(--gold);
    box-shadow:0 4px 24px rgba(198,161,91,0.25);
    transform:translateY(-2px);
  }
  .btn:hover::before{ transform:scaleX(1); }
  .btn:focus-visible{
    outline:2px solid var(--gold-soft);
    outline-offset:3px;
  }

  .btn-primary{
    border-color:var(--gold);
    background:rgba(198,161,91,0.12);
  }

  .notice{
    margin-top:5vh;
    font-size:11.5px;
    letter-spacing:.08em;
    color:var(--text-secondary);
    opacity:0;
    animation:fadeIn 1.2s ease-out 2.6s forwards;
  }

  .notice::before{
    content:'※ ';
    color:var(--gold);
  }

  /* 小さい画面対応 */
  @media (max-height:640px), (max-width:420px){
    .logo-text{ font-size:20px; }
    .divider{ margin:2.6vh 0; height:3.4vh; }
    .notice{ margin-top:3vh; }
    .actions{ gap:14px; }
    .btn{ min-width:130px; padding:12px 18px; font-size:12px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
    .bg-photo{ transform:none; }
  }
</style>
</head>
<body>

  <div class="bg-photo" aria-hidden="true"></div>
  <div class="fog-band fog-1" aria-hidden="true"></div>
  <div class="fog-band fog-2" aria-hidden="true"></div>
  <div class="fog-dark" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <main class="content">
    <div class="logo-wrap">
      <div class="logo-glow"></div>
      <span class="logo-text">合同会社SPACE</span>
    </div>

    <p class="catch">
      <span class="line">経営とは、哲学である</span>
      <span class="line">見えない軸を、確かな強さへ</span>
      <span class="line words">
        <span class="word w1">MIND</span><span class="sep">・</span><span class="word w2">MENTAL</span><span class="sep">・</span><span class="word w3">BODY</span><span class="sep">・</span><span class="word w4">SPIRIT</span>
      </span>
    </p>

    <div class="divider" aria-hidden="true"></div>

    <nav class="actions">
      <a class="btn btn-primary" href="introduction.html">サービス</a>
      <a class="btn" href="inquiry.html">コンタクト</a>
    </nav>

    <p class="notice">サービスのご利用にはご紹介者様が必要となります。</p>
  </main>

</body>
</html>
